# Block A1: crazyflow's rpm2thrust checked with the victim on the load cell. See README.md, A1.
#
# Values marked [FILL] come from the lab, [VERIFY] are checked on the bench (a1_probe.py, B1-B6).

# Who reads the load cell (spec section 1). "S": the victim, which logs it to its own card. The two
# load cell tests of 21 Nov showed it with cf10: deck.bcLoadcell 1 and the SD deck working on the
# same drone, the card matching 94 % of the radio values. "R1": the victim, but the card does not
# work with the load cell deck stacked; everything then comes over the radio at 100 Hz.
# "R2" and "P" (another device or the PC reads it) do not apply to this stand.
case = "S"
g = 9.81 # m/s^2, grams of force to N

[victim]
id = 10 # cf10, radio://0/80/2M/E7E7E7E70A, the drone of the load cell tests; not cf3 (spec ...03)
channel = 80
radio = 0
model = "cf21B_500" # crazyflow's model whose rpm2thrust is checked
mass_kg = 0.0 # [FILL] cf10 weighed with SD deck, card, markers and battery (or the supply leads)
mount = "upright" # "upright" (the A2/A3 mount) or "upside_down"
# Whether the victim is clamped to the load cell, which then takes the pull above its weight, up
# to max_thrust_factor_hover and the cell's rating. Clamped on the stand (user, 21 Nov). Resting
# on the cell instead, the total thrust would stay below resting_thrust_fraction of its weight so
# it never lifts off, which keeps the sweep below hover.
clamped = true

[load_cell]
# The firmware computes loadcell.weight = a * loadcell.rawWeight + b. Calibration run 5 of the new
# cell (21 Nov, 0-50 g, 10 SPS, calibscale.py --drone-on-top with cf10 on it), from
# crazyflie-firmware/tools/system_id/calibration.toml: grams of upward force on the victim,
# thrust positive. Neither survives a reboot, the scripts set them after every connect.
a = 7.26815116086076e-5
b = 156.48154812390965
# Force on the victim, up positive, is force_sign * g / 1000 * (weight - tare). +1 with the
# drone-on-top calibration for the upright mount: thrust already reads positive (the spec's -1
# assumed a calibration with positive weights). The conversion asserts that the force rises with
# the rpm, as the cell's output reversed once after 20 Nov.
force_sign = 1
# loadcell.sampleRate: 0, 1, 2, 3, 7 = 10, 20, 40, 80, 320 SPS. 3 is what the load cell tests ran
# at (noise 0.012 g); 7 (the spec's) is untested, switch only after B3 passes with it.
sample_rate = 3
radio_period_ms = 10 # 100 Hz radio log of the load cell and the motors
# [FILL] rating of the cell in g; it was calibrated from 0 to 50 g. A clamped victim pulls on it
# with up to 2 x m g minus its weight, so the sweep refuses to run until this is filled in.
capacity_g = 0

[sweep]
# Raw motorPowerSet commands, 0-65535. On the brushless they become the DShot throttle (ratio >> 5;
# below 1504 the motor stops), not a fraction of thrust. Clipped at run time to [limits].
cmd_levels = [12000, 16000, 20000, 24000, 28000, 32000, 36000, 40000, 44000, 48000, 52000, 56000]
hold_s = 4.0 # s per level
discard_s = 1.5 # s of spin-up and load cell settling dropped from the start of each window
tare_s = 5.0 # s with the motors off, at the start, middle and end of every block
idle_s = 1.0 # s at the idle command before and after each sync pulse
center_cmd = 0 # [FILL after B5] command near hover thrust, or the highest allowed one, repeated
center_every = 6 # levels between two center levels
repeats = 2 # randomized orders of the level list per block
single_motor_levels = 6 # levels per motor in the single-motor block
# Command of the motor that ends the single-motor ramp, the one that gave 1.5 x hover thrust per
# rotor in block all. 0 estimates it from the linear thrust map of sysid/config_drones.toml.
single_max_cmd = 0 # [FILL after block all]
# The three other motors in the single-motor block idle at the firmware's idle thrust instead of
# stopping: a motor of an armed drone spinning down through 1-500 rpm for 200 ms trips the
# motors-not-responding check and locks the supervisor. Their thrust is subtracted with the curve
# of block all.
idle_cmd = 7000 # CONFIG_MOTORS_DEFAULT_IDLE_THRUST of the cf21bl build, 1000-3500 rpm [VERIFY]
seed = 0

[sync_pulse]
cmd = 26000 # about 40 %; lowered to the largest allowed command if it exceeds [limits]
duration_s = 0.3

[limits]
max_thrust_frac_capacity = 0.8 # stop raising the command above this fraction of capacity_g
max_thrust_factor_hover = 2.0 # and above 2 x m g in total (clamped victim)
resting_thrust_fraction = 0.8 # of m g, the cap if the victim only rested on the cell (guard)
vbat_min_block = 3.7 # V at rest at the start of a block (battery)
vbat_min_abort = 3.4 # V under load
rpm_invalid_s = 0.5 # s of rpm 65535 on a commanded motor before the block stops

[crazyflow]
# cf21B_500's first_principles rpm2thrust, read from crazyflow at run time and asserted equal
rpm2thrust = [0.0, -3.133427287299859e-7, 4.407354891648379e-10]

[reference]
# What the hover flights already said about crazyflow's curve, for a1_fit.py to compare with. The
# thrust_scale multiplies crazyflow's rpm2thrust (hover: m g over the thrust the logged rpm give).
# They come from other drones and props, so they show the direction, not cf10's value.
thrust_scale_cf3_hover = 0.9046 # vic09-12, cf3 weighed 45.25 g, 0.4907 N from rpm (hover config)
thrust_scale_downwash_config = 0.92 # downwash/config.toml, both drones
# Mass that crazyflow's curve implied from the rpm of a hover, and the weighed mass of that drone.
# dw00 (the spec's) was only compared with crazyflow's model mass of 43.4 g, it has no weighing.
implied_mass_g = { dw00 = 46.2, vic09_12 = 50.02 }
weighed_mass_g = { vic09_12 = 45.25 }
