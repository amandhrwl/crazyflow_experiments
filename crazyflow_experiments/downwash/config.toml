# Block A3 of the downwash experiment: flyover passes of the source over the hovering victim.
# Values marked [FILL] come from the lab, see README.md.

[drones]
model = "cf21B_500"                 # crazyflow's parameters of both, mass and thrust are per drone
pos_update_freq = 20                # Hz, motion capture pose sent to the onboard estimators

# mass_kg and thrust_scale belong to the physical drone. thrust_scale multiplies crazyflow's
# rpm2thrust of the model: the steady-hover thrust from the logged rpm over mass_kg * g, inverted

[drones.victim]
radio = 0
id = 10                              # the drone with the victim card; source before 19 Nov
tf_name = "cf1"                     # its rigid body in the motion capture; the radio address is still the one of cf10 (id 10)
channel = 80
hover_xy = [0.0, 0.0]               # the victim hovers straight above this point
hover_z = 0.8                       # m; 0.8 so that the 1.0 m passes keep the source at 1.8 m, where the motion capture still sees it (user, 22 Nov; was 1.0)
# [FILL] cf1 weighed for the free flights, without the systemID deck (and with its card, markers
# and battery). 0 keeps free-flight runs from starting: the 0.051322 kg that stood here was cf4's,
# weighed 19 Nov. The stand runs do not use it, the victim's weight on the load cell is in
# a1_config.toml.
mass_kg = 0.0
thrust_scale = 0.9503               # cf1, A1 on the load cell (21 Nov, 0.950 +- 0.003), see results/downwash/a1/rpm2thrust.toml; cf4's estimate was 0.92

[drones.source]
radio = 0
id = 3                            # the drone with the source card; victim before 19 Nov
channel = 80                        # same channel: both share radio 0, the radio keys are not read
mass_kg = 0.04589                   # cf3 weighed 45.89 g (user, 28 Nov; 45.25 g before) with deck, card, markers and battery
thrust_scale = 0.92                 # hover of vic09-12 (cf3) at 45.25 g, 0.4907 N from rpm over m g

[control]
ctrl_freq = 100

[a3]
speeds = [0.5, 1.0, 1.5]            # m/s; v_max is appended by a3_design.py, the arena's limit capped at max_speed (0.5, 1.0, 1.5, 2.0; was 0.5, 1.0, 1.4 until 22 Nov)
max_speed = 2.0                     # m/s, caps v_max (user, 22 Nov)
height_seps = [0.25, 0.5, 0.75, 1.0]  # m, source above the victim, flown free; with the victim at 0.8 m the highest pass is at 1.8 m, where the motion capture still sees the source (user, 22 Nov; 0.25, 0.5, 0.8 until then, 0.4, 0.8, 1.2 before 21 Nov). The stand flies [stand] height_seps
legs_per_flight = 8                 # a repeat of the 16 cells is cut into flights of 8: the 1.0 and 0.75 m heights, then 0.5 and 0.25 m, so the stand's heights fill the flights it flies
lateral_offset = 0.0
repeats = 3
ramp = 1.0
cruise_half = 0.6
settle_time = 0.6                   # [FILL] from F0 if the source settles more slowly
hover_time = 2.0
pause_time = 1.5                    # s at the end point after the pass (3.0 until 21 Nov)
wait_time = 3.0                     # s of still air after each leg (8.0 until 21 Nov); the moves and the hover add ~10 s more before the next pass
move_speed = 0.8                    # m/s, sets the move duration (0.4 until 21 Nov)
min_move_time = 1.5
return_lane = 1.0                   # m, y offset from the victim of the lane the source flies back in
seed = 25                           # of the shuffled orders of flights 2 and 3, kept from the old design

[a2]
# Block A2, the static map: the source holds still at a grid of offsets over the victim, one dwell
# each. The heights are [a3] height_seps in free flight and [stand] height_seps on the stand, flown
# far to near; the moves, the takeoff and the safety limits are the [a3] ones.
offsets_x = [0.0, 0.05, -0.05, 0.10, -0.10, 0.20, -0.20]  # m along x, the y offset is 0
part_sizes = [4, 3]                 # offsets per part: [ref, 4 offsets] then [ref, 3 offsets, ref]; a spin run flies one part (the victim's battery gives ~45 s of spin)
reference_dx = -1.0                 # m, the reference dwells before and after: outside the jet, the tare and the drift check
dwell_s = 3.0                       # s held at each point
discard_s = 1.0                     # s of it the source settles and the wake builds up, not used
off_target_tol = 0.05               # m, a dwell whose mean position in the plane is farther from its target is flagged

[sync]
hop_height = 0.05
hop_time = 1.0

[takeoff]                           # from wherever the drones stand, at least 1 m apart
duration = 4.0                      # s of the straight climb; the level transfer takes move_speed
hover_time = 4.0                    # s of hover after it, before the legs: 2.0 left the source 27 cm off its path at the first tick (22 Nov)

[safety]
arena_min = [-3.8, -2.1, 0.0]       # [VERIFY] the room is about 8 x 4.5 m (user, 22 Nov), so these keep 0.2 m (x) and 0.15 m (y) to its walls. The abort fence of the loop and the takeoff, not the flight envelope: the passes need x +-3.1 m (half 2.8 m + 0.3 m margin) and the return lane y +-1.1 m. +-3.5 x, +-2.0 y until 22 Nov
arena_max = [3.8, 2.1, 2.0]         # the setpoints stay 0.1 m below the ceiling, i.e. at 1.8 m at most; the stand's runs use [stand] arena_max_z
x_margin = 0.3
# m, while |Δxy| < xy_guard. 0.15 since the lowest pass flies 0.25 m above the victim (the design
# keeps the commanded paths SEPARATION_MARGIN = 0.05 m above it): a source 10 cm below a 0.25 m
# pass aborts, while the two drones, about 5 cm tall, stay clear of each other.
min_vertical_sep = 0.15
xy_guard = 0.40
max_tracking_error = 0.35           # m, either drone, measured vs the commanded path of the last 0.3 s. 0.25 until 22 Nov: the source lags its setpoint by 0.17 s, 16 to 24 cm at the end of every move, and 0.25 aborted the stand runs
victim_max_drop = 0.25              # m below hover_z
vbat_min_start = 3.8                # V at rest before take-off, both drones
vbat_min_close_leg = 3.45           # V under load before a Δz <= 0.4 leg (pair.CLOSE_HEIGHT_SEP), else the leg is skipped and logged; F1 (18 Nov) read 3.45–3.50 there

[stand]
# A3 on the stand (a3_deploy.py --stand [--spin]): the legs above over the victim cf1 clamped on
# the load cell. The load cell calibration and the victim's weighed mass come from a1_config.toml,
# the same stand. The passes fly up to 0.5 m above the stand's victim (about 1.54 m), so the
# arena's ceiling is raised for these runs (2.73 m was confirmed to fit the room, user, 21 Nov).
arena_max_z = 2.9                   # [VERIFY] m, ceiling of the stand runs, 0.1 m above the hop
height_seps = [0.25, 0.5]           # m, the A3 separations the stand runs fly (user, 21 Nov: at most 0.5 m)
clearance = 0.5                     # m, horizontal distance of the source's takeoff and landing from the victim
baseline_time = 5.0                 # s of still air, motors off, before the takeoff and after the landing
# Hover command of the spin runs, motorPowerSet units: where A1's block all (21 Nov,
# all_2026-11-21_20-44-06) measured the weighed 54.25 g in thrust, interpolated between its ok
# windows at 48000 (508.9 mN) and 56000 (622.0 mN). That block ran on a sagging battery (3.5 V
# there), so at a fuller battery the same command makes more thrust; the conversion takes the
# thrust from the rpm through cf1's A1 curve, and the spin-alone baseline of every leg measures it.
hover_cmd = 49649
# The victim spins per leg on its battery (A1: 4.0 to 3.4 V within a minute near hover), see
# a3_stand.py. Before each pass: tare_s motors off, arm_lead_s for the arming, spin_settle_s for the
# rpm to settle (A1 discarded the first 1.5 s of every level), baseline_s of spin alone while the
# source hovers at the leg's start; after it spin_after_s, then motors off.
tare_s = 2.0
arm_lead_s = 1.5                    # A1: about 1 s per arming
spin_settle_s = 1.5                 # A1's discard_s
baseline_s = 2.0                    # the source's hover before the pass lasts 2 s
spin_after_s = 1.5                  # the wake reaches the victim 0.1 to 0.35 s after the source (arrival_s)
rest_gap_s = 3.0                    # s from a leg's motor stop to the next tare, for the battery to recover
vbat_rest_min = 3.6                 # V at rest in the tare; below it the remaining legs fly without spinning
vbat_load_min = 3.4                 # V under load (A1's abort): stops the victim's motors, never the source
battery_spin_s = 45.0               # [VERIFY] s of hover spin one battery gives, A1: ~1 min from 4.0 to 3.4 V with rising thrust
